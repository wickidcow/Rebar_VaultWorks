# One Vault Power Base supplies one contiguous column of up to six Vault Cells.
# Power is consumed by the base; Vault Cells themselves have no visible wire port.
power:
  # Idle electronics / column-controller demand.
  base-watts: 16.0
  # Additional demand for every contiguous Vault Cell above the base.
  watts-per-vault: 8.0

# Rebar applies its global cargo transfer multiplier to the rear Vault Cargo Node.
cargo:
  items-per-tick: 8

storage:
  # Single-item bulk capacity. Existing contents are never truncated if this is lowered.
  basic-capacity: 1000000
  powered-capacity: 4000000

  # Safety default: false means excess input remains at the source.
  # Players may enable purge per Vault Cell from its GUI.
  overflow-purge-default: false

# Read-only Vault Index topology safety bound.
# Traversal follows only loaded Vault Link, Vault Index and Vault Power Base blocks.
index:
  max-network-nodes: 4096

# Paged Terminal rendering safety bound. The network snapshot may contain more
# types, but a single GUI refresh will materialize at most this many item buttons.
terminal:
  max-item-types: 4096


# Loaded-only wireless access. Wireless Vault Terminals never force-load the
# transmitter or storage network they are bound to.
wireless:
  # Rebar electricity demand of one Vault Transmitter.
  transmitter-watts: 32.0

  # Base same-world range without an adjacent Vault Antenna.
  base-range-blocks: 64.0

  # Same-world range when at least one Vault Antenna is directly adjacent.
  antenna-range-blocks: 512.0

  # When true, a directly adjacent Dimensional Vault Antenna permits access
  # from another loaded world/dimension. The source transmitter must still be
  # loaded and powered.
  allow-cross-dimension: true
