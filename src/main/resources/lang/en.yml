addon: "VaultWorks"
guide:
  page:
    vaultworks: "VaultWorks"

item:
  encoded_circuit:
    name: "Encoded Circuit"
    lore: |-
      <arrow> Core logic component for VaultWorks devices
      <arrow> Used by storage, power, indexing and fabrication hardware

  memory_wafer:
    name: "Memory Wafer"
    lore: |-
      <arrow> Stores item and network metadata
      <arrow> A building block for lattices and indexed storage

  storage_lattice:
    name: "Storage Lattice"
    lore: |-
      <arrow> Structured storage memory for VaultWorks cells
      <arrow> Honeycomb-inspired visual without requiring a resource pack

  vault_link:
    name: "Vault Link Cable"
    lore: |-
      <arrow> Explicit metadata link for VaultWorks indexing
      <arrow> Connect Vault Index blocks to Vault Power Bases
      <arrow> Adjacent Power Bases can link directly
      <arrow> Passive: no ticking, no item ownership and no chunk loading

  vault_index:
    name: "Vault Index"
    lore: |-
      <arrow> Read-only overview of explicitly connected Vault storage
      <arrow> Shows columns, Vaults, item types, capacity and accessible stock
      <arrow> Traverses loaded Vault Links and Power Bases only
      <arrow> Does not move or own items

  vault_terminal:
    name: "Vault Terminal"
    lore: |-
      <arrow> Search, deposit and withdraw across the connected Vault network
      <arrow> Paged view shows total and currently accessible stock
      <arrow> Live anvil search supports names, @namespace, #online and #offline
      <arrow> Left = stack, right = 1, shift-left = fill inventory
      <arrow> Shift-right deposits matching items; top hopper deposits inventory
      <arrow> Every mutation revalidates loaded powered physical Vault Cells

  vault_transmitter:
    name: "Vault Transmitter"
    lore: |-
      <arrow> Powered wireless access point for one connected Vault network
      <arrow> Also works as a normal local Vault Terminal
      <arrow> Bind a Wireless Vault Terminal by sneak-right-clicking this block
      <arrow> Uses loaded-only access and never force-loads remote storage
      <arrow> Add a Vault Antenna for longer same-world range

  vault_antenna:
    name: "Vault Antenna"
    lore: |-
      <arrow> Place directly adjacent to a Vault Transmitter
      <arrow> Extends Wireless Vault Terminal range in the same world
      <arrow> Passive upgrade with no ticking or chunk loading

  dimensional_vault_antenna:
    name: "Dimensional Vault Antenna"
    lore: |-
      <arrow> Endgame wireless upgrade for an adjacent Vault Transmitter
      <arrow> Permits access from another world or dimension
      <arrow> The source transmitter must still be loaded and powered
      <arrow> No world is hard-coded, leaving future dimensions compatible

  wireless_vault_terminal:
    name: "Wireless Vault Terminal"
    lore: |-
      <arrow> Portable access to one bound Vault Transmitter
      <arrow> Sneak-right-click a transmitter to bind this terminal
      <arrow> Right-click to open the remote Vault inventory
      <arrow> Normal antenna range applies in the same world
      <arrow> Cross-dimensional access requires a Dimensional Vault Antenna
      <arrow> Never force-loads the bound transmitter or storage chunks

  vault_power_base:
    name: "Vault Power Base"
    lore: |-
      <arrow> Place directly below a vertical Vault Cell column
      <arrow> Powers up to 6 contiguous Vault Cells above it
      <arrow> Power demand scales with the number of connected Vaults
      <arrow> Rear-facing Rebar power port keeps wiring behind the Vault wall
      <arrow> The base lights when energized; stored-item displays brighten when online
      <arrow> Storage controls and cargo lock when the base is not powered

  vault_cargo_node:
    name: "Vault Cargo Node"
    lore: |-
      <arrow> Place directly behind a Vault Cell
      <arrow> Connect Rebar cargo to the outward-facing side
      <arrow> Moves only the item registered in that Vault
      <arrow> Automatically stops when the Vault column loses power

  basic_vault_cell:
    name: "Basic Vault Cell"
    lore: |-
      <arrow> Single-item high-capacity physical storage
      <arrow> Hold an item and register exactly 1 from the GUI
      <arrow> The registered item floats inside the Vault block
      <arrow> Quick deposit/withdraw and optional overflow purge
      <arrow> Placement is limited to a 6-cell column above a Vault Power Base
      <arrow> Breaking the Vault keeps its stored state inside the dropped cell

  powered_vault_cell:
    name: "Powered Vault Cell"
    lore: |-
      <arrow> Higher-capacity single-item Vault storage
      <arrow> Uses the ominous Vault visual for the advanced tier
      <arrow> Uses the same Vault Power Base and rear Cargo Node layout
      <arrow> Must be in a powered column of no more than 6 Vault Cells
      <arrow> Breaking the Vault keeps its stored state inside the dropped cell
