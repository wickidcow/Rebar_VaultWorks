name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaultworks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tested-jar-sha256: ${{ steps.tested-jar.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew clean build --stacktrace --no-daemon

      - name: Verify packaged VaultWorks JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR="$(find build/libs -maxdepth 1 -type f -name 'Rebar_VaultWorks-*.jar' | sort | head -n 1)"
          if [[ -z "$JAR" || ! -f "$JAR" ]]; then
            echo "VaultWorks JAR was not produced."
            exit 1
          fi

          ENTRIES="$(jar tf "$JAR")"
          REQUIRED_ENTRIES=(
            "plugin.yml"
            "config.yml"
            "lang/en.yml"
            "io/github/wickidcow/vaultworks/VaultWorks.class"
            "io/github/wickidcow/vaultworks/VaultWorksContentCatalog.class"
            "io/github/wickidcow/vaultworks/BasicVaultCell.class"
            "io/github/wickidcow/vaultworks/VaultTerminal.class"
            "io/github/wickidcow/vaultworks/VaultTransmitter.class"
            "io/github/wickidcow/vaultworks/WirelessVaultTerminalItem.class"
          )
          for REQUIRED in "${REQUIRED_ENTRIES[@]}"; do
            if ! grep -Fxq "$REQUIRED" <<<"$ENTRIES"; then
              echo "Packaged VaultWorks JAR is missing $REQUIRED"
              exit 1
            fi
          done

          FORBIDDEN_PREFIXES=(
            "io/github/pylonmc/rebar/"
            "io/papermc/paper/"
            "org/bukkit/"
            "xyz/xenondevs/invui/"
          )
          for FORBIDDEN_PREFIX in "${FORBIDDEN_PREFIXES[@]}"; do
            if grep -Fq "$FORBIDDEN_PREFIX" <<<"$ENTRIES"; then
              echo "VaultWorks JAR unexpectedly bundles classes under $FORBIDDEN_PREFIX"
              exit 1
            fi
          done

          PLUGIN_YML="$(unzip -p "$JAR" plugin.yml)"
          grep -Fq 'name: VaultWorks' <<<"$PLUGIN_YML"
          grep -Fq 'main: io.github.wickidcow.vaultworks.VaultWorks' <<<"$PLUGIN_YML"
          grep -Fq 'Rebar' <<<"$PLUGIN_YML"
          grep -Fq 'vaultworks:' <<<"$PLUGIN_YML"
          grep -Fq 'vaultworks.admin' <<<"$PLUGIN_YML"

          echo "Packaged VaultWorks JAR contents verified."

      - name: Download verified upstream electricity server
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .upstream/rebar
          curl --fail --location --retry 3 https://nightly.link/pylonmc/rebar/actions/runs/36620712190/rebar-2064.zip -o .upstream/rebar/server.zip
          echo 'ed9bbaf30511b804beaf2daf1b3024e0612056bac8b3d78f0550460d9b1394d0  .upstream/rebar/server.zip' | sha256sum -c -
          unzip .upstream/rebar/server.zip -d .upstream/rebar

      - name: Smoke test Paper + Rebar + VaultWorks
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf run
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt

          INPUT_PIPE="$RUNNER_TEMP/vaultworks-smoke-input"
          LOG_FILE="$RUNNER_TEMP/vaultworks-smoke.log"
          rm -f "$INPUT_PIPE" "$LOG_FILE"
          mkfifo "$INPUT_PIPE"

          ./gradlew runServer -Prebar.serverJar="$GITHUB_WORKSPACE/.upstream/rebar/rebar-2064.jar" --stacktrace --no-daemon < "$INPUT_PIPE" > "$LOG_FILE" 2>&1 &
          SERVER_PID=$!

          exec 3>"$INPUT_PIPE"

          READY=0
          for _ in $(seq 1 120); do
            if grep -Fq "Validated 14 VaultWorks content entries and survival recipes." "$LOG_FILE" \
              && grep -Fq "VaultWorks ready:" "$LOG_FILE" \
              && grep -Fq "Done (" "$LOG_FILE"; then
              READY=1
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [[ "$READY" -ne 1 ]]; then
            echo "VaultWorks did not reach the expected ready state."
            cat "$LOG_FILE"
            echo "stop" >&3 || true
            exec 3>&-
            wait "$SERVER_PID" || true
            exit 1
          fi

          if grep -Eq "Error occurred while enabling VaultWorks|VaultWorks failed to enable|Could not load plugin.*VaultWorks" "$LOG_FILE"; then
            echo "VaultWorks startup emitted a fatal plugin error."
            cat "$LOG_FILE"
            echo "stop" >&3 || true
            exec 3>&-
            wait "$SERVER_PID" || true
            exit 1
          fi

          echo "vaultworks doctor" >&3

          DOCTOR_READY=0
          for _ in $(seq 1 15); do
            if grep -Fq "VaultWorks Doctor result: PASS" "$LOG_FILE"; then
              DOCTOR_READY=1
              break
            fi
            if grep -Fq "VaultWorks Doctor result: FAIL" "$LOG_FILE"; then
              break
            fi
            sleep 1
          done

          if [[ "$DOCTOR_READY" -ne 1 ]]; then
            echo "The live VaultWorks doctor did not report PASS."
            cat "$LOG_FILE"
            echo "stop" >&3 || true
            exec 3>&-
            wait "$SERVER_PID" || true
            exit 1
          fi

          echo "stop" >&3
          exec 3>&-

          STOPPED=0
          for _ in $(seq 1 30); do
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              STOPPED=1
              break
            fi
            sleep 1
          done

          if [[ "$STOPPED" -ne 1 ]]; then
            echo "Paper/Gradle did not stop within 30 seconds."
            cat "$LOG_FILE"
            kill "$SERVER_PID" 2>/dev/null || true
            sleep 2
            kill -9 "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" || true
            exit 1
          fi

          if ! wait "$SERVER_PID"; then
            echo "Paper/Gradle exited unsuccessfully after the smoke test."
            cat "$LOG_FILE"
            exit 1
          fi

          if grep -Eiq "Error occurred while disabling VaultWorks|(ERROR|SEVERE).*VaultWorks" "$LOG_FILE"; then
            echo "VaultWorks emitted an error during startup, doctor, or shutdown."
            cat "$LOG_FILE"
            exit 1
          fi

          echo "VaultWorks Paper smoke test passed."
          grep -F "Validated 14 VaultWorks content entries and survival recipes." "$LOG_FILE"
          grep -F "VaultWorks ready:" "$LOG_FILE"
          grep -F "Done (" "$LOG_FILE"
          grep -F "VaultWorks Doctor result: PASS" "$LOG_FILE"

      - name: Record smoke-tested raw JAR digest
        id: tested-jar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'Rebar_VaultWorks-*.jar' | sort | head -n 1)"
          if [[ -z "$JAR" || ! -f "$JAR" ]]; then
            echo "Smoke-tested VaultWorks JAR was not found."
            exit 1
          fi
          SHA256="$(sha256sum "$JAR" | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Smoke-tested JAR SHA-256: $SHA256"

  publish-development-jar:
    name: Publish raw development JAR
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rebuild raw JAR from tested source
        run: ./gradlew clean jar --stacktrace --no-daemon

      - name: Verify rebuilt JAR matches smoke-tested bytes
        env:
          TESTED_SHA256: ${{ needs.build.outputs.tested-jar-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'Rebar_VaultWorks-*.jar' | sort | head -n 1)"
          if [[ -z "$JAR" || ! -f "$JAR" || -z "$TESTED_SHA256" ]]; then
            echo "Missing rebuilt JAR or smoke-tested digest."
            exit 1
          fi

          REBUILT_SHA256="$(sha256sum "$JAR" | awk '{print $1}')"
          if [[ "$REBUILT_SHA256" != "$TESTED_SHA256" ]]; then
            echo "Rebuilt JAR does not match smoke-tested bytes."
            echo "Smoke-tested: $TESTED_SHA256"
            echo "Rebuilt:      $REBUILT_SHA256"
            exit 1
          fi

      - name: Publish rolling development JAR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          JAR="$(find build/libs -maxdepth 1 -type f -name 'Rebar_VaultWorks-*.jar' | sort | head -n 1)"
          ASSET_NAME="$(basename "$JAR")"

          if gh release view dev-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/git/refs/tags/dev-build" -f sha="$GITHUB_SHA" -F force=true >/dev/null

            while IFS= read -r OLD_ASSET; do
              if [[ -n "$OLD_ASSET" && "$OLD_ASSET" != "$ASSET_NAME" ]]; then
                gh release delete-asset dev-build "$OLD_ASSET" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done < <(gh release view dev-build --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(test("^Rebar_VaultWorks-.*\\.jar$"))')

            gh release upload dev-build "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit dev-build               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --notes "Rolling raw JAR from the latest successful smoke-tested main build. Tested commit: $GITHUB_SHA. Development snapshot; not a stable release."               --prerelease
          else
            gh release create dev-build "$JAR"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "VaultWorks Development Build"               --notes "Rolling raw JAR from the latest successful smoke-tested main build. Tested commit: $GITHUB_SHA. Development snapshot; not a stable release."               --prerelease
          fi

          EXPECTED_DIGEST="sha256:$(sha256sum "$JAR" | awk '{print $1}')"
          PUBLISHED_DIGEST="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/dev-build" | jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .digest')"
          if [[ "$PUBLISHED_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "Published JAR digest does not match the verified raw JAR."
            exit 1
          fi
          echo "Published raw JAR verified: $EXPECTED_DIGEST"
