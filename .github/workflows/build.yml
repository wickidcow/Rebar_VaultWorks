name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaultworks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tested-jar-sha256: ${{ steps.tested-jar.outputs.sha256 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew clean build --stacktrace --no-daemon

      - name: Verify packaged VaultWorks JAR
        shell: bash
        run: |
          set -euo pipefail

          JAR="$(find build/libs -maxdepth 1 -type f -name 'Rebar_VaultWorks-*.jar' | sort | head -n 1)"
          if [[ -z "$JAR" || ! -f "$JAR" ]]; then
            echo "VaultWorks JAR was not produced."
            exit 1
          fi

          ENTRIES="$(jar tf "$JAR")"
          REQUIRED_ENTRIES=(
            "plugin.yml"
            "config.yml"
            "lang/en.yml"
            "io/github/wickidcow/vaultworks/VaultWorks.class"
            "io/github/wickidcow/vaultworks/VaultWorksContentCatalog.class"
            "io/github/wickidcow/vaultworks/BasicVaultCell.class"
            "io/github/wickidcow/vaultworks/VaultTerminal.class"
            "io/github/wickidcow/vaultworks/VaultTransmitter.class"
            "io/github/wickidcow/vaultworks/WirelessVaultTerminalItem.class"
          )
          for REQUIRED in "${REQUIRED_ENTRIES[@]}"; do
            if ! grep -Fxq "$REQUIRED" <<<"$ENTRIES"; then
              echo "Packaged VaultWorks JAR is missing $REQUIRED"
              exit 1
            fi
          done

          FORBIDDEN_PREFIXES=(
            "io/github/pylonmc/rebar/"
            "io/papermc/paper/"
            "org/bukkit/"
            "xyz/xenondevs/invui/"
          )
          for FORBIDDEN_PREFIX in "${FORBIDDEN_PREFIXES[@]}"; do
            if grep -Fq "$FORBIDDEN_PREFIX" <<<"$ENTRIES"; then
              echo "VaultWorks JAR unexpectedly bundles classes under $FORBIDDEN_PREFIX"
              exit 1
            fi
          done

          PLUGIN_YML="$(unzip -p "$JAR" plugin.yml)"
          grep -Fq 'name: VaultWorks' <<<"$PLUGIN_YML"
          grep -Fq 'main: io.github.wickidcow.vaultworks.VaultWorks' <<<"$PLUGIN_YML"
          grep -Fq 'Rebar' <<<"$PLUGIN_YML"
          grep -Fq 'vaultworks:' <<<"$PLUGIN_YML"
          grep -Fq 'vaultworks.admin' <<<"$PLUGIN_YML"

          echo "Packaged VaultWorks JAR contents verified."

      - name: Download verified released Rebar server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .upstream/rebar
          curl --fail --location --retry 3 https://github.com/pylonmc/rebar/releases/download/0.44.4-26.2/rebar-0.44.4-26.2.jar -o .upstream/rebar/rebar.jar
          echo 'fd7573a3124b9836641a4e15fc85ff998b3fed894f58f5eb8002eff44d3a884b  .upstream/rebar/rebar.jar' | sha256sum -c -

      - name: Verify real storage operations and clean restart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'server-ip=127.0.0.1\nonline-mode=false\nview-distance=2\nsimulation-distance=2\n' > run/server.properties
          for ATTEMPT in 1 2; do
            LOG_FILE="$RUNNER_TEMP/vaultworks-runtime-$ATTEMPT.log"
            timeout 240 ./gradlew runServer -Prebar.serverJar="$GITHUB_WORKSPACE/.upstream/rebar/rebar.jar" -Pvaultworks.runtimeTests --no-daemon --console=plain > "$LOG_FILE" 2>&1 || { cat "$LOG_FILE"; exit 1; }
            grep -F 'VAULTWORKS RUNTIME PASS:' "$LOG_FILE" || { cat "$LOG_FILE"; exit 1; }
            grep -F 'VaultWorks Doctor result: PASS' "$LOG_FILE" || { cat "$LOG_FILE"; exit 1; }
            if grep -Eq 'VAULTWORKS RUNTIME FAIL|Error occurred while (enabling|disabling) VaultWorks' "$LOG_FILE"; then cat "$LOG_FILE"; exit 1; fi
          done
          grep -F 'PASS cell contents survive clean restart' "$RUNNER_TEMP/vaultworks-runtime-2.log"
          grep -F 'PASS claim buffer survives clean restart' "$RUNNER_TEMP/vaultworks-runtime-2.log"
          grep -F 'PASS failed transfer locks survive clean restart' "$RUNNER_TEMP/vaultworks-runtime-2.log"
          grep -F 'PASS all source compensation survives restart despite inventory restore failure' "$RUNNER_TEMP/vaultworks-runtime-2.log"

      - name: Record smoke-tested raw JAR digest
        id: tested-jar
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'Rebar_VaultWorks-*.jar' | sort | head -n 1)"
          if [[ -z "$JAR" || ! -f "$JAR" ]]; then
            echo "Smoke-tested VaultWorks JAR was not found."
            exit 1
          fi
          SHA256="$(sha256sum "$JAR" | awk '{print $1}')"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Smoke-tested JAR SHA-256: $SHA256"

  publish-development-jar:
    name: Publish raw development JAR
    if: >
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rebuild raw JAR from tested source
        run: ./gradlew clean jar --stacktrace --no-daemon

      - name: Verify rebuilt JAR matches smoke-tested bytes
        env:
          TESTED_SHA256: ${{ needs.build.outputs.tested-jar-sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name 'Rebar_VaultWorks-*.jar' | sort | head -n 1)"
          if [[ -z "$JAR" || ! -f "$JAR" || -z "$TESTED_SHA256" ]]; then
            echo "Missing rebuilt JAR or smoke-tested digest."
            exit 1
          fi

          REBUILT_SHA256="$(sha256sum "$JAR" | awk '{print $1}')"
          if [[ "$REBUILT_SHA256" != "$TESTED_SHA256" ]]; then
            echo "Rebuilt JAR does not match smoke-tested bytes."
            echo "Smoke-tested: $TESTED_SHA256"
            echo "Rebuilt:      $REBUILT_SHA256"
            exit 1
          fi

      - name: Publish rolling development JAR
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          JAR="$(find build/libs -maxdepth 1 -type f -name 'Rebar_VaultWorks-*.jar' | sort | head -n 1)"
          ASSET_NAME="$(basename "$JAR")"

          if gh release view dev-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/git/refs/tags/dev-build" -f sha="$GITHUB_SHA" -F force=true >/dev/null

            while IFS= read -r OLD_ASSET; do
              if [[ -n "$OLD_ASSET" && "$OLD_ASSET" != "$ASSET_NAME" ]]; then
                gh release delete-asset dev-build "$OLD_ASSET" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done < <(gh release view dev-build --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(test("^Rebar_VaultWorks-.*\\.jar$"))')

            gh release upload dev-build "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit dev-build               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --notes "Rolling raw JAR from the latest successful smoke-tested main build. Tested commit: $GITHUB_SHA. Development snapshot; not a stable release."               --prerelease
          else
            gh release create dev-build "$JAR"               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --title "VaultWorks Development Build"               --notes "Rolling raw JAR from the latest successful smoke-tested main build. Tested commit: $GITHUB_SHA. Development snapshot; not a stable release."               --prerelease
          fi

          EXPECTED_DIGEST="sha256:$(sha256sum "$JAR" | awk '{print $1}')"
          PUBLISHED_DIGEST="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/dev-build" | jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .digest')"
          if [[ "$PUBLISHED_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "Published JAR digest does not match the verified raw JAR."
            exit 1
          fi
          echo "Published raw JAR verified: $EXPECTED_DIGEST"
