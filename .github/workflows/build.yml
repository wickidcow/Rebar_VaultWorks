name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew clean build --no-daemon
      - name: Verify plugin packaging
        run: |
          set -euo pipefail
          JAR=$(find build/libs -name 'Rebar_VaultWorks-*.jar' | head -1)
          test -n "$JAR"
          unzip -p "$JAR" plugin.yml | grep -q 'name: VaultWorks'
          if jar tf "$JAR" | grep -Eq '^(org/bukkit|io/github/pylonmc/rebar)/'; then exit 1; fi
      - uses: actions/upload-artifact@v6
        with:
          name: Rebar_VaultWorks
          path: build/libs/Rebar_VaultWorks-*.jar
          if-no-files-found: error
