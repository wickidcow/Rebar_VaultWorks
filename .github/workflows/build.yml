name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew clean build --no-daemon
      - name: Verify plugin packaging
        run: |
          set -euo pipefail
          JAR=$(find build/libs -name 'Rebar_VaultWorks-*.jar' | head -1)
          test -n "$JAR"
          unzip -p "$JAR" plugin.yml | grep -q 'name: VaultWorks'
          if jar tf "$JAR" | grep -Eq '^(org/bukkit|io/github/pylonmc/rebar)/'; then exit 1; fi
      - name: Publish tested raw development JAR
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          JARS=(build/libs/Rebar_VaultWorks-*.jar)
          if [[ ${#JARS[@]} -ne 1 ]]; then
            echo "Expected exactly one plugin JAR."
            exit 1
          fi
          JAR="${JARS[0]}"
          NOTES_FILE="$RUNNER_TEMP/development-release-notes.txt"
          printf '%s\n' "Raw plugin JAR from tested main commit $GITHUB_SHA." "Development snapshot; not a stable release." "Requires Paper 26.2, Java 25 and electricity-enabled Rebar build 2064." > "$NOTES_FILE"

          if gh release view dev-build --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh api --method PATCH "/repos/$GITHUB_REPOSITORY/git/refs/tags/dev-build" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload dev-build "$JAR" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit dev-build --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes-file "$NOTES_FILE" --prerelease
          else
            gh release create dev-build "$JAR" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "VaultWorks Development Build" --notes-file "$NOTES_FILE" --prerelease
          fi

          EXPECTED_DIGEST="sha256:$(sha256sum "$JAR" | awk '{print $1}')"
          ASSET_NAME="$(basename "$JAR")"
          PUBLISHED_DIGEST="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/dev-build" | jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .digest')"
          if [[ "$PUBLISHED_DIGEST" != "$EXPECTED_DIGEST" ]]; then
            echo "Published JAR digest does not match the tested JAR."
            exit 1
          fi
          echo "Published raw JAR verified: $EXPECTED_DIGEST"
