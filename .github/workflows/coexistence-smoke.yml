name: VaultWorks + GridWorks coexistence smoke

on:
  pull_request:
    paths:
      - '.github/workflows/coexistence-smoke.yml'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'src/**'
      - 'docs/ELECTRICITY-VALIDATION.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vaultworks-gridworks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coexistence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: init.defaultBranch
      GIT_CONFIG_VALUE_0: main
    steps:
      - name: Checkout VaultWorks pull request
        uses: actions/checkout@v7

      - name: Checkout reviewed GridWorks Timer Controller commit
        uses: actions/checkout@v7
        with:
          repository: wickidcow/Rebar_GridWorks
          ref: 7b0d3a3104108ef4c0ac6a38d42b202ded2b573e
          path: .coexistence/gridworks
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build pinned GridWorks review JAR
        shell: bash
        run: |
          set -euo pipefail
          (cd .coexistence/gridworks && ./gradlew clean jar --stacktrace --no-daemon)
          test -f .coexistence/gridworks/build/libs/Rebar_GridWorks-0.4.0-SNAPSHOT.jar
          jar tf .coexistence/gridworks/build/libs/Rebar_GridWorks-0.4.0-SNAPSHOT.jar \
            | grep -Fxq io/github/wickidcow/gridworks/content/block/TimerControllerBlock.class

      - name: Download checksum-verified released Rebar server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .upstream/rebar
          curl --fail --location --retry 3 \
            https://github.com/pylonmc/rebar/releases/download/0.44.4-26.2/rebar-0.44.4-26.2.jar \
            -o .upstream/rebar/rebar.jar
          echo 'fd7573a3124b9836641a4e15fc85ff998b3fed894f58f5eb8002eff44d3a884b  .upstream/rebar/rebar.jar' \
            | sha256sum -c -

      - name: Validate VaultWorks and GridWorks on the same Paper server and restart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          printf 'server-ip=127.0.0.1\nonline-mode=false\nview-distance=2\nsimulation-distance=2\n' > run/server.properties
          for ATTEMPT in 1 2; do
            LOG="$RUNNER_TEMP/vaultworks-gridworks-$ATTEMPT.log"
            timeout 300 ./gradlew runServer \
              -Prebar.serverJar="$GITHUB_WORKSPACE/.upstream/rebar/rebar.jar" \
              -Pgridworks.serverJar="$GITHUB_WORKSPACE/.coexistence/gridworks/build/libs/Rebar_GridWorks-0.4.0-SNAPSHOT.jar" \
              -Pvaultworks.runtimeTests --stacktrace --no-daemon --console=plain > "$LOG" 2>&1 \
              || { cat "$LOG"; exit 1; }
            grep -F 'Validated 26 GridWorks content entries and survival recipes.' "$LOG" \
              || { cat "$LOG"; exit 1; }
            grep -F 'GridWorks control bus initialized' "$LOG" \
              || { cat "$LOG"; exit 1; }
            grep -F 'PASS GridWorks is enabled alongside VaultWorks on real Paper/Rebar' "$LOG" \
              || { cat "$LOG"; exit 1; }
            grep -F 'GridWorks Doctor result: PASS' "$LOG" \
              || { cat "$LOG"; exit 1; }
            grep -F 'VaultWorks Doctor result: PASS' "$LOG" \
              || { cat "$LOG"; exit 1; }
            grep -F 'VAULTWORKS RUNTIME PASS:' "$LOG" \
              || { cat "$LOG"; exit 1; }
            if grep -Eq 'VAULTWORKS RUNTIME FAIL|GridWorks Doctor result: FAIL|Error occurred while (enabling|disabling) (VaultWorks|GridWorks)' "$LOG"; then
              cat "$LOG"
              exit 1
            fi
          done
          grep -F 'PASS cell contents survive clean restart' "$RUNNER_TEMP/vaultworks-gridworks-2.log"
          grep -F 'PASS per-cell hologram preference survives clean restart' "$RUNNER_TEMP/vaultworks-gridworks-2.log"
          grep -F 'PASS failed transfer locks survive clean restart' "$RUNNER_TEMP/vaultworks-gridworks-2.log"
          echo 'VaultWorks + GridWorks same-server two-pass smoke test passed.'
